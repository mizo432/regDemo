spring:
  application:
    name: regDemo

  threads:
    virtual:
      enabled: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:h2:file:./data/regdemo;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${H2_PASSWORD:regdemo_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false
      path: /h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration

# 税率設定
reg:
  tax:
    rate: 0.1  # 標準税率 10%
    reducedRate: 0.08  # 軽減税率 8%
